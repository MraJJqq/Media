<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>K线手势</title>
<style>
:root{--up:#12a06b;--dn:#d93a3f}
@media (prefers-color-scheme:dark){:root{--up:#22b07d;--dn:#e5484d}}
html,body{height:100%;margin:0;background:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:transparent}#vegas-ema{z-index:2;pointer-events:none;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="vegas-ema" aria-hidden="true"></canvas>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),emaCanvas=document.getElementById('vegas-ema');
let vegasOverlay=null;
const T0=10,B=10,MINW=2,MAXW=40,PAD=5;
let C=[],W=0,H=0,dpr=1,col={},barW=9,right=0,lo=0,hi=1,inited=false,vel=0,lastT=0,raf=0;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

/* 模拟4小时数据：真实数据用 setCandles([{t,o,h,l,c},...]) 替换，t 为毫秒时间戳 */
function gen(n){
  let s=20261105;
  const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const g=()=>{let u=0;for(let k=0;k<6;k++)u+=rnd();return u-3};
  let p=68000,v=.006;const T=144e5,t0=Math.floor(Date.now()/T)*T-(n-1)*T,a=[];
  for(let i=0;i<n;i++){
    v=clamp(v*.98+.006*.02+Math.abs(g())*.0012,.003,.02);
    const o=p,c=o*(1+g()*v*1.4);
    a.push({t:t0+i*T,o,h:Math.max(o,c)*(1+rnd()*v*.6),l:Math.min(o,c)*(1-rnd()*v*.6),c});
    p=c;
  }
  return a;
}

/* 坐标（价格为对数坐标） */
const xOf=i=>W-(right-i+.5)*barW;
const iAt=x=>right+.5-(W-x)/barW;
const yOf=p=>T0+(Math.log(hi)-Math.log(p))/(Math.log(hi)-Math.log(lo))*(H-T0-B);
function syncVegasEma(){if(vegasOverlay)vegasOverlay.setView({barW,right,lo,hi,W,H,T0,B})}
function setRight(v){const n=C.length;right=clamp(v,Math.min(4,n-1),n-1+PAD)}

/* 渲染：仅在需要时绘制 */
function readColors(){const s=getComputedStyle(document.documentElement);['up','dn'].forEach(k=>col[k]=s.getPropertyValue('--'+k).trim())}
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  const r=cv.getBoundingClientRect();W=r.width;H=r.height;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  readColors();ask();
}
function ask(){if(!raf)raf=requestAnimationFrame(loop)}
function loop(t){
  raf=0;const dt=Math.min(t-lastT,40)||16;lastT=t;
  if(Math.abs(vel)>.0004){const r0=right;setRight(right+vel*dt);if(right===r0)vel=0;vel*=Math.pow(.94,dt/16);ask()}else vel=0;
  frame();
}
function frame(){
  const n=C.length;if(!n||!W)return;
  const i0=Math.max(0,Math.floor(iAt(0))),i1=Math.min(n-1,Math.ceil(iAt(W)));
  let mn=Infinity,mx=-Infinity;
  for(let i=i0;i<=i1;i++){if(C[i].l<mn)mn=C[i].l;if(C[i].h>mx)mx=C[i].h}
  if(mn===Infinity){mn=lo;mx=hi}
  const m=(mx-mn)*.08||mn*.001;mn-=m;mx+=m;
  if(!inited){lo=mn;hi=mx;inited=true}
  else{lo+=(mn-lo)*.3;hi+=(mx-hi)*.3;if(Math.abs(mn-lo)+Math.abs(mx-hi)>(mx-mn)*.002)ask();else{lo=mn;hi=mx}}
  draw(i0,i1);
  syncVegasEma();
}
/* K线：空心（涨空心、跌实心，颜色按前一根收盘价）；合并为4条路径一次绘制 */
function draw(i0,i1){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  let bw=Math.max(1,Math.round(barW*.7));if(bw>2&&bw%2===0)bw--;
  const fu=new Path2D(),fd=new Path2D(),su=new Path2D(),sd=new Path2D();
  for(let i=i0;i<=i1;i++){
    const c=C[i],up=c.c>=(i?C[i-1].c:c.o),F=up?fu:fd,S=up?su:sd;
    const x=xOf(i),yh=yOf(c.h),yl=yOf(c.l),yo=yOf(c.o),yc=yOf(c.c);
    const top=Math.min(yo,yc),bot=Math.max(yo,yc),wx=Math.round(x-.5);
    if(c.c>=c.o&&bw>=3&&bot-top>2){
      F.rect(wx,yh,1,Math.max(0,top-yh));F.rect(wx,bot,1,Math.max(0,yl-bot));
      S.rect(Math.round(x-bw/2)+.5,Math.round(top)+.5,bw-1,Math.round(bot-top)-1);
    }else{
      F.rect(wx,yh,1,Math.max(1,yl-yh));
      if(barW>=3)F.rect(Math.round(x-bw/2),top,bw,Math.max(1,bot-top));
    }
  }
  ctx.fillStyle=col.up;ctx.fill(fu);ctx.fillStyle=col.dn;ctx.fill(fd);
  ctx.lineWidth=1;ctx.strokeStyle=col.up;ctx.stroke(su);ctx.strokeStyle=col.dn;ctx.stroke(sd);
}

/* 手势：单指平移（带惯性）、双指捏合缩放 */
const P=new Map();
let pinch=null,hist=[];
const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
function startPinch(){
  const[a,b]=[...P.values()];
  pinch={d0:Math.max(Math.hypot(a.x-b.x,a.y-b.y),10),bw0:barW,ai:iAt((a.x+b.x)/2)};
  vel=0;
}
function updatePinch(){
  const[a,b]=[...P.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2;
  barW=clamp(pinch.bw0*d/pinch.d0,MINW,MAXW);
  setRight(pinch.ai-.5+(W-mx)/barW);ask();
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const p=pos(e);P.set(e.pointerId,{x:p.x,y:p.y});vel=0;
  if(P.size===1)hist=[];else if(P.size===2)startPinch();
});
cv.addEventListener('pointermove',e=>{
  const s=P.get(e.pointerId);if(!s)return;
  e.preventDefault();
  const p=pos(e);
  if(P.size>=2){s.x=p.x;s.y=p.y;if(pinch)updatePinch();return}
  setRight(right-(p.x-s.x)/barW);s.x=p.x;s.y=p.y;
  hist.push({t:e.timeStamp,r:right});
  while(hist.length>1&&e.timeStamp-hist[0].t>100)hist.shift();
  ask();
});
function end(e){
  if(!P.delete(e.pointerId))return;
  if(pinch&&P.size<2){pinch=null;hist=[]}
  if(P.size>0)return;
  if(e.type==='pointerup'&&hist.length>=2){
    const a=hist[0],b=hist[hist.length-1];
    if(e.timeStamp-b.t<60){vel=clamp((b.r-a.r)/Math.max(b.t-a.t,16),-1.5,1.5);lastT=performance.now();ask()}
  }
  hist=[];
}
cv.addEventListener('pointerup',end);
cv.addEventListener('pointercancel',end);
cv.addEventListener('lostpointercapture',e=>end({pointerId:e.pointerId,type:'pointercancel',timeStamp:e.timeStamp}));
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&!e.ctrlKey)setRight(right+e.deltaX/barW);
  else{const x=pos(e).x,ai=iAt(x);barW=clamp(barW*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),MINW,MAXW);setRight(ai-.5+(W-x)/barW)}
  ask();
},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

/* 启动 */
window.setCandles=a=>{
  C=Array.isArray(a)?a.filter(c=>c&&Number.isFinite(Number(c.t))&&Number(c.o)>0&&Number(c.h)>0&&Number(c.l)>0&&Number(c.c)>0).map(c=>({t:Number(c.t),o:Number(c.o),h:Number(c.h),l:Number(c.l),c:Number(c.c)})).sort((x,y)=>x.t-y.t):[];
  inited=false;vel=0;setRight(C.length-1+PAD);vegasOverlay?.setCandles(C);
  if(!C.length){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);const ec=emaCanvas.getContext("2d");ec.setTransform(dpr,0,0,dpr,0,0);ec.clearRect(0,0,W,H);return;}
  ask();
};
window.addEventListener("message",event=>{
  if(event.origin!=="https://mrajjqq.github.io"||event.source!==window.parent)return;
  const data=event.data;
  if(data?.type==="VEGAS_KLINE_SET_CANDLES"&&Array.isArray(data.candles))window.setCandles(data.candles);
});
C=gen(2000);setRight(C.length-1+PAD);
import("https://mrajjqq.github.io/Media/Charts/vegas-ema.js").then(({createVegasEmaOverlay})=>{vegasOverlay=createVegasEmaOverlay({canvas:emaCanvas});vegasOverlay.setCandles(C);syncVegasEma()}).catch(error=>console.error("[VEGAS EMA] module load failed",error));
window.addEventListener("pagehide",()=>vegasOverlay?.destroy(),{once:true});
new ResizeObserver(resize).observe(cv);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readColors();ask()});
resize();
})();
</script>
</body>
</html>
