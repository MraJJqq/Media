name: Deploy V6 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate time-tunnel background from V6-local source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy scipy pillow
          cd assets/backgrounds
          python ../../tools/bg_3_tunnel.py
      - name: Validate V6 standalone resources and runtime wiring
        run: python tools/validate_v6.py
      - name: Validate Python sources
        run: python -m py_compile tools/*.py
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
