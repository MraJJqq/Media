name: Media V6 system reliability tests

on:
  push:
    branches: [main]
    paths:
      - 'V6/**'
      - 'Backgrounds/**'
      - 'Brand/**'
      - 'Logos/**'
      - 'Cards/**'
      - 'Charts/**'
      - 'References/**'
      - 'Templates/**'
      - 'UI/**'
      - 'README.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-v6-kline-tests
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Media V6 site
        run: python3 tools/validate_v6.py
      - name: Install isolated test dependency
        run: npm install --prefix /tmp/media-test-deps --no-save --package-lock=false fake-indexeddb@6.2.4
      - name: Run all V6 system reliability tests
        shell: bash
        run: |
          ln -s /tmp/media-test-deps/node_modules node_modules
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find . -name '*.js' -not -path './node_modules/*' -print0)
          node --test tests/*.test.mjs
